name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with: { node-version: '18' }
      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build APK
        run: |
          bubblewrap init --manifest="https://nebulatools.netlify.app/manifest.json" --directory=app
          bubblewrap build --directory=app
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NebulaTools-APK
          path: app/app-release-signed.apk
