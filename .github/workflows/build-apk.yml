name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Create WebView APK
        run: |
          npx create-webview-app@latest \
            --name "NebulaTools" \
            --url "https://alzyddnebulaverse.netlify.app/" \
            --package "com.nebulatools.app" \
            --output "NebulaTools.apk"
            
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NebulaTools-APK
          path: NebulaTools.apk
