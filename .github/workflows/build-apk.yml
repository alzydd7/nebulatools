name: APK Builder

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/nebulatools
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.nebulatools'
              compileSdk 33
              defaultConfig {
                  applicationId "com.nebulatools.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">NebulaTools</string></resources>
          EOF

          cat > app/src/main/java/com/nebulatools/MainActivity.java << 'EOF'
          package com.nebulatools;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("https://alzyddnebulaverse.netlify.app/");
                  setContentView(wv);
              }
          }
          EOF

          cat > settings.gradle << 'EOF'
          rootProject.name = "NebulaTools"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          EOF

      - name: Build APK
        run: |
          cd app
          gradle assembleRelease
          cd ..
          cp app/build/outputs/apk/release/app-release-unsigned.apk NebulaTools.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: NebulaTools-APK
          path: NebulaTools.apk
